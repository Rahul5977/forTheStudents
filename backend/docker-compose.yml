# Local dev dependencies. `pnpm dev:db` starts DynamoDB Local on :8000.
# For a fuller local AWS, swap in LocalStack (see docs/architecture.md §12).
services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: sc-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
